<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest Verification - Hyeokju & Madison</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Great+Vibes&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Immediate Redirect Check -->
    <script>
        (function() {
            if (sessionStorage.getItem('wedding_verified') === 'true') {
                window.location.href = 'index.html';
            }
        })();
    </script>
</head>

<body class="auth-page">
    <!-- Background overlay for smooth transitions -->
    <div class="bg-vignette"></div>

    <!-- Floating Top-Left Language Selector -->
    <nav class="language-nav" aria-label="Language selection">
        <button class="lang-btn active" id="lang-en" data-lang="en">EN (영어)</button>
        <span class="lang-divider">/</span>
        <button class="lang-btn" id="lang-ko" data-lang="ko">KR (한국어)</button>
    </nav>

    <main class="main-container">
        <!-- Premium Glassmorphic Verification Card -->
        <article class="save-the-date-card login-card" id="login-card">

            <!-- Corner Decorative Elements -->
            <div class="corner-gold top-left"></div>
            <div class="corner-gold top-right"></div>
            <div class="corner-gold bottom-left"></div>
            <div class="corner-gold bottom-right"></div>

            <div class="card-content-fade" id="card-content-fade">
                <!-- Header -->
                <header class="card-header">
                    <span class="save-the-date-tag" data-i18n="guestVerification">GUEST VERIFICATION</span>
                    <div class="gold-divider"></div>
                    <p class="announcement" data-i18n="loginAnnouncement">WELCOME TO THE WEDDING WEBSITE OF HYEOKJU & MADISON</p>
                    <p class="login-sub-announcement" data-i18n="loginSubAnnouncement" style="font-family: var(--font-sans); font-size: 0.85rem; letter-spacing: 0.05em; color: var(--color-text-muted); margin-top: 0.5rem; text-transform: uppercase;">Please enter your name and phone number to access the website.</p>
                </header>

                <!-- Form -->
                <form class="rsvp-form" id="login-form" style="margin-top: 2rem;">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="login-first-name" data-i18n="loginFirstName">First Name</label>
                            <input type="text" id="login-first-name" name="first_name" required placeholder="e.g., John">
                        </div>
                        <div class="form-group">
                            <label for="login-last-name" data-i18n="loginLastName">Last Name</label>
                            <input type="text" id="login-last-name" name="last_name" required placeholder="e.g., Doe">
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 1.2rem;">
                        <label for="login-phone" data-i18n="loginPhone">Cell Phone Number</label>
                        <input type="tel" id="login-phone" name="phone" required placeholder="e.g., (123) 456-7890">
                    </div>

                    <button type="submit" class="btn btn-submit btn-primary" id="btn-login-submit" style="margin-top: 2rem; width: 100%;">
                        <span class="btn-text" data-i18n="verifyButton">Verify & Enter</span>
                        <span class="spinner hide"></span>
                    </button>
                    <div class="form-message" id="login-message"></div>
                </form>
            </div>

        </article>
    </main>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>

</html>
