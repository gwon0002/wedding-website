<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save the Date - Hyeokju Gwon & Madison Marshall</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Save the Date for the wedding of Hyeokju Gwon (Jason) & Madison Marshall on October 1, 2027 in Mechanicsburg, Ohio.">
    <meta name="keywords"
        content="Hyeokju Gwon, Madison Marshall, Wedding, Save the Date, Mechanicsburg OH, Jason Gwon">
    <meta name="author" content="Jason Gwon">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Save the Date: Hyeokju & Madison">
    <meta property="og:description" content="We are getting married! Join us on October 1, 2027 in Mechanicsburg, OH.">
    <meta property="og:image" content="assets/wedding_background.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Great+Vibes&family=Montserrat:wght@200;300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Background overlay for smooth transitions -->
    <div class="bg-vignette"></div>

    <!-- Floating Top-Left Language Selector -->
    <nav class="language-nav" aria-label="Language selection">
        <button class="lang-btn active" id="lang-en" data-lang="en">EN (영어)</button>
        <span class="lang-divider">/</span>
        <button class="lang-btn" id="lang-ko" data-lang="ko">KR (한국어)</button>
    </nav>

    <main class="main-container">
        <!-- Premium Glassmorphic Save the Date Card -->
        <article class="save-the-date-card" id="save-the-date-card">

            <!-- Corner Decorative Elements -->
            <div class="corner-gold top-left"></div>
            <div class="corner-gold top-right"></div>
            <div class="corner-gold bottom-left"></div>
            <div class="corner-gold bottom-right"></div>

            <!-- Card Content Wrapper for Smooth Fade Animations -->
            <div class="card-content-fade" id="card-content-fade">
                <!-- Top Header -->
                <header class="card-header">
                    <span class="save-the-date-tag" data-i18n="saveTheDate">SAVE THE DATE</span>
                    <div class="gold-divider"></div>
                    <p class="announcement" data-i18n="announcement">FOR THE WEDDING OF</p>
                </header>

                <!-- Couples' Names -->
                <section class="names-section">
                    <div class="name-container groom-container">
                        <h1 class="couple-name" id="groom-name" data-i18n="groom">Hyeokju Gwon</h1>
                        <span class="sub-name" data-i18n="jasonSub">Jason</span>
                    </div>

                    <div class="ampersand-container">
                        <span class="ampersand">&amp;</span>
                    </div>

                    <div class="name-container bride-container">
                        <h2 class="couple-name" data-i18n="bride">Madison Marshall</h2>
                    </div>
                </section>

                <!-- Event Details -->
                <section class="details-section">
                    <div class="detail-item date-item">
                        <!-- Calendar Icon SVG -->
                        <svg class="detail-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                        <time class="event-date" id="event-date" datetime="2027-10-01" data-i18n="date">October 1,
                            2027</time>
                    </div>

                    <div class="detail-item location-item">
                        <!-- Map Pin Icon SVG -->
                        <svg class="detail-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                        <address class="event-location" data-i18n="location">Mechanicsburg, OH 43044</address>
                    </div>
                </section>

                <!-- Countdown Timer -->
                <section class="countdown-section" aria-label="Countdown to wedding">
                    <div class="countdown-container">
                        <div class="countdown-box" id="days-box">
                            <span class="countdown-value" id="days">00</span>
                            <span class="countdown-label" data-i18n="daysLabel">Days</span>
                        </div>
                        <div class="countdown-box" id="hours-box">
                            <span class="countdown-value" id="hours">00</span>
                            <span class="countdown-label" data-i18n="hoursLabel">Hours</span>
                        </div>
                        <div class="countdown-box" id="minutes-box">
                            <span class="countdown-value" id="minutes">00</span>
                            <span class="countdown-label" data-i18n="minsLabel">Mins</span>
                        </div>
                        <div class="countdown-box" id="seconds-box">
                            <span class="countdown-value" id="seconds">00</span>
                            <span class="countdown-label" data-i18n="secsLabel">Secs</span>
                        </div>
                    </div>
                </section>

                <!-- Action Buttons -->
                <footer class="card-actions">
                    <div class="dropdown-container">
                        <button class="btn btn-primary" id="btn-calendar" aria-expanded="false" aria-haspopup="true">
                            <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                            </svg>
                            <span id="btn-calendar-text" data-i18n="addCalendar">Add to Calendar</span>
                        </button>
                        <div class="dropdown-menu" id="calendar-dropdown">
                            <a href="#" id="add-google" class="dropdown-item" data-i18n="googleCal">Google Calendar</a>
                            <a href="#" id="add-apple" class="dropdown-item" data-i18n="appleCal">Apple Calendar
                                (.ics)</a>
                            <a href="#" id="add-outlook" class="dropdown-item" data-i18n="outlookCal">Outlook
                                Calendar</a>
                        </div>
                    </div>

                    <a href="https://maps.google.com/?q=4690+Mechanicsburg-Sanford+Rd,+Mechanicsburg,+OH+43044"
                        class="btn btn-secondary" id="btn-location">
                        <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                        </svg>
                        <span data-i18n="viewMap">View Map</span>
                    </a>
                </footer>

                <!-- Invitation Footer -->
                <div class="card-footer">
                    <p class="formal-invite" data-i18n="formalInvite">Formal Invitation to Follow</p>
                </div>
            </div>

        </article>
    </main>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>

</html>
